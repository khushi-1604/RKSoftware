<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us - Software Development Company</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script>
      window.onload = function () {
        const sentenceElement = document.getElementById("mySentence");
        const textToSpeak = sentenceElement.textContent;

        if ("speechSynthesis" in window) {
          const utterance = new SpeechSynthesisUtterance(textToSpeak);

          // Optional: Customize the speech
          utterance.voice = speechSynthesis
            .getVoices()
            .find((voice) => voice.lang === "en-US"); // You can change the language
          utterance.rate = 0.8; // Speed of speech (0.1 to 1.0)
          utterance.pitch = 1; // Pitch of speech (0 to 2)

          speechSynthesis.speak(utterance);
        } else {
          console.log("Speech synthesis is not supported in this browser.");
          // Optionally display a message to the user
        }
      };
    </script>
    <header>
      <div class="companyname">RK Software</div>
      <p id="mySentence" style="display: none">Welcome to RK Software</p>

      <div class="circle-container">
        <div class="circle"></div>
        <img
          src="images/logo.png"
          alt="Your Image"
          class="image-above-circle"
        />
      </div>
    </header>

    <section class="about-us">
      <div class="button-container">
        <button class="animate-left-button" style="top: 30%">Home</button>
        <button
          class="animate-left-button"
          style="top: 40%"
          onclick="window.location.href = 'aboutus.html'"
        >
          About
        </button>
        <button
          class="animate-left-button"
          style="top: 50%"
          onclick="window.location.href = 'services.html'"
        >
          Services
        </button>
        <button
          class="animate-left-button"
          style="top: 60%"
          onclick="window.location.href = 'client.html'"
        >
          Clients
        </button>
        <button
          class="animate-left-button"
          style="top: 70%"
          onclick="window.location.href = 'contact.html'"
        >
          Contact
        </button>
      </div>
      <div class="tagline">Next Gen solutions for a digital world</div>
      <div class="about-video">
        <video width="3200" height="2400" autoplay loop muted>
          <source
            src="images/vecteezy_planet-earth-enveloped-in-a-network-of-glowing-connections_51199041.mp4"
            type="video/mp4"
          />
          Your browser does not support the video tag.
        </video>
      </div>
    </section>
    <footer>
      <p>&copy; 2025 Software Development Company. All rights reserved.</p>
    </footer>
  </body>
</html>
