<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us - Software Development Company</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script>
      window.onload = function () {
        const sentenceElement = document.getElementById("mySentence");
        const textToSpeak = sentenceElement.textContent;
        const currentURL = window.location.href;
        const playedKey = `ttsPlayedSession_${encodeURIComponent(currentURL)}`;
        const hasPlayed = sessionStorage.getItem(playedKey);

        if ("speechSynthesis" in window && !hasPlayed) {
          let maleVoice;

          const speakWithMaleVoice = () => {
            if (maleVoice) {
              const utterance = new SpeechSynthesisUtterance(textToSpeak);
              utterance.voice = maleVoice;
              utterance.rate = 0.8;
              utterance.pitch = 1;
              speechSynthesis.speak(utterance);
              sessionStorage.setItem(playedKey, "true");
            } else {
              console.log("Male voice not found.");
              // Optionally speak with a fallback voice if desired
              const utterance = new SpeechSynthesisUtterance(textToSpeak);
              speechSynthesis.speak(utterance);
              sessionStorage.setItem(playedKey, "true");
            }
          };

          speechSynthesis.onvoiceschanged = () => {
            const voices = speechSynthesis.getVoices();
            maleVoice = voices.find((voice) =>
              voice.name.toLowerCase().includes("male")
            );
            speakWithMaleVoice();
          };

          // Initial check for voices (may be available immediately)
          const initialVoices = speechSynthesis.getVoices();
          maleVoice = initialVoices.find((voice) =>
            voice.name.toLowerCase().includes("male")
          );
          if (initialVoices.length > 0 && maleVoice) {
            speakWithMaleVoice();
          } else if (initialVoices.length > 0 && !maleVoice) {
            // Speak with a fallback if no male voice is immediately available
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            speechSynthesis.speak(utterance);
            sessionStorage.setItem(playedKey, "true");
          }
        } else if ("speechSynthesis" in window && hasPlayed) {
          console.log(
            `Text-to-speech has already played on this link in this session: ${currentURL}`
          );
        } else {
          console.log("Speech synthesis is not supported in this browser.");
        }
      };
    </script>
    <header>
      <div class="companyname">RK Software</div>
      <p id="mySentence" style="display: none">Welcome to RK Software</p>

      <div class="circle-container">
        <div class="circle"></div>
        <img
          src="images/logo.png"
          alt="Your Image"
          class="image-above-circle"
        />
      </div>
    </header>

    <section class="about-us">
      <div class="button-container">
        <button class="animate-left-button" style="top: 30%">Home</button>
        <button
          class="animate-left-button"
          style="top: 40%"
          onclick="window.location.href = 'aboutus.html'"
        >
          About
        </button>
        <button
          class="animate-left-button"
          style="top: 50%"
          onclick="window.location.href = 'services.html'"
        >
          Services
        </button>
        <button
          class="animate-left-button"
          style="top: 60%"
          onclick="window.location.href = 'client.html'"
        >
          Clients
        </button>
        <button
          class="animate-left-button"
          style="top: 70%"
          onclick="window.location.href = 'contact.html'"
        >
          Contact
        </button>
      </div>
      <div class="tagline">Next Gen solutions for a digital world</div>
      <div class="about-video">
        <video width="3200" height="2400" autoplay loop muted>
          <source
            src="images/vecteezy_planet-earth-enveloped-in-a-network-of-glowing-connections_51199041.mp4"
            type="video/mp4"
          />
          Your browser does not support the video tag.
        </video>
      </div>
    </section>
    <footer>
      <p>
        &copy; 2025 Software Development Company developed by Khushi Shukla.
      </p>
    </footer>
  </body>
</html>
