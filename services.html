<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us</title>
    <link rel="stylesheet" href="css/service.css" />
  </head>
  <body>
    <h1
      style="
        text-align: center;
        background-color: #e0eba8f5;
        padding: 20px;
        margin: 1px;
        color: #4615d8;
      "
    >
      SERVICES
    </h1>
    <div class="container">
      <section class="about-us">
        <div class="button-container">
          <button
            class="animate-left-button"
            style="top: 30%"
            onclick="window.location.href = 'index.html'"
          >
            Home
          </button>
          <button
            class="animate-left-button"
            style="top: 40%"
            onclick="window.location.href = 'aboutus.html'"
          >
            About
          </button>
          <button
            class="animate-left-button"
            style="top: 50%"
            onclick="window.location.href = 'service.html'"
          >
            Services
          </button>
          <button
            class="animate-left-button"
            style="top: 60%"
            onclick="window.location.href = 'client.html'"
          >
            Clients
          </button>
          <button
            class="animate-left-button"
            style="top: 70%"
            onclick="window.location.href = 'contact.html'"
          >
            Contact
          </button>
        </div>
      </section>
      <section class="mysection">
        <section class="left-section">
          <div class="award-image-container">
            <img src="images/mobile.jpg" alt="Award Image 1" />
            <p>Mobile Application Development</p>
          </div>
          <div class="award-image-container">
            <img src="images/website.jpg" alt="Award Image 2" />
            <p>Website Development</p>
          </div>
        </section>
        <section class="right-section">
          <div class="award-image-container">
            <img src="images/plc.jpg" alt="Award Image 1" />
            <p>PLC Programming</p>
          </div>
          <div class="award-image-container">
            <img src="images/automation.jpg" alt="Award Image 2" />
            <p>Atomization</p>
          </div>
        </section>
      </section>
    </div>
  </body>
</html>
