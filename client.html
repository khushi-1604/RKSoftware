<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Clients</title>
    <link rel="stylesheet" href="css/client.css" />
  </head>
  <body>
    <div class="container">
      <section class="our-clients-heading">
        <h2>OUR CLIENTS</h2>
      </section>
      <div class="main-content">
        <section class="about-us">
          <div class="button-container">
            <button
              class="animate-left-button"
              onclick="window.location.href = 'index.html'"
            >
              Home
            </button>
            <button
              class="animate-left-button"
              onclick="window.location.href = 'aboutus.html'"
            >
              About
            </button>
            <button
              class="animate-left-button"
              onclick="window.location.href = 'services.html'"
            >
              Services
            </button>
            <button
              class="animate-left-button"
              onclick="window.location.href = 'client.html'"
            >
              Clients
            </button>
            <button
              class="animate-left-button"
              onclick="window.location.href = 'contact.html'"
            >
              Contact
            </button>
          </div>
        </section>
        <section class="clients-section">
          <div class="clients-grid">
            <div class="client-logo">
              <img src="images/banco.png" alt="GIFT Logo" />
              <p>Banco Products India Ltd</p>
            </div>
            <div class="client-logo">
              <img src="images/cipher.jpg" alt="Balaram Panda Trust Logo" />
              <p>Cipher Sonic Labs, Boston, US</p>
            </div>
            <div class="client-logo">
              <img src="images/baroda.png" alt="Client Logo 3" />
              <p>Baroda Extrusion Ltd</p>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
