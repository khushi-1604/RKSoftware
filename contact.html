<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <script
      src="https://kit.fontawesome.com/c32adfdcda.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <section>
      <div class="section-header">
        <div class="container">
          <h2>Contact Us</h2>
          <p>Have questions or feedback? Contact us — we're here to help!</p>
        </div>
      </div>

      <div class="container">
        <div class="row">
          <section class="about-us">
            <div class="button-container">
              <button
                class="animate-left-button"
                style="top: 30%"
                onclick="window.location.href = 'index.html'"
              >
                Home
              </button>
              <button
                class="animate-left-button"
                style="top: 40%"
                onclick="window.location.href = 'aboutus.html'"
              >
                About
              </button>
              <button
                class="animate-left-button"
                style="top: 50%"
                onclick="window.location.href = 'services.html'"
              >
                Services
              </button>
              <button
                class="animate-left-button"
                style="top: 60%"
                onclick="window.location.href = 'client.html'"
              >
                Clients
              </button>
              <button
                class="animate-left-button"
                style="top: 70%"
                onclick="window.location.href = 'contact.html'"
              >
                Contact
              </button>
            </div>
          </section>
          <div class="contact-info">
            <div class="contact-info-item">
              <div class="contact-info-icon">
                <i class="fas fa-home"></i>
              </div>

              <div class="contact-info-content">
                <h4>Address</h4>
                <p>
                  E-902 Fortune Serenity <br />
                  Ghanteshwar, Rajkot, <br />360006
                </p>
              </div>
            </div>

            <div class="contact-info-item">
              <div class="contact-info-icon">
                <i class="fas fa-phone"></i>
              </div>

              <div class="contact-info-content">
                <h4>Phone</h4>
                <p>+91 9925029949</p>
              </div>
            </div>

            <div class="contact-info-item">
              <div class="contact-info-icon">
                <i class="fas fa-envelope"></i>
              </div>

              <div class="contact-info-content">
                <h4>Email</h4>
                <p>khushiyshukla@gmail.com</p>
              </div>
            </div>
          </div>

          <div class="contact-form">
            <form
              action="https://formspree.io/f/mnndppyz"
              method="POST"
              id="contact-form"
            >
              <h2>Send Message</h2>
              <div class="input-box">
                <input type="text" required="true" name="name" />
                <span>Full Name</span>
              </div>

              <div class="input-box">
                <input type="email" required="true" name="email" />
                <span>Email</span>
              </div>

              <div class="input-box">
                <textarea required="true" name="message"></textarea>
                <span>Type your Message...</span>
              </div>

              <div class="input-box">
                <input type="submit" value="Send" name="submit" />
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
